<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>__TITLE__</title>
<style>
:root{--bg:#eef2f7;--panel:#ffffff;--text:#16202c;--muted:#5a6878;--line:#d5dde7;--accent:#0b6bcb;--accent-soft:#e3effb;--warn:#b4530a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.6 "Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;display:grid;grid-template-columns:minmax(0,1fr) 360px;height:100dvh}
#stage{position:relative;min-height:0;overflow:hidden}
#stage canvas{display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;z-index:1}
.tag{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:4px;padding:3px 9px;font-size:14px;line-height:1.35;text-align:center;white-space:nowrap;color:var(--text);pointer-events:auto;cursor:pointer}
.tag.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700;z-index:2}
.tag .name{display:none;margin-left:4px}.tag.on .name,.tag:hover .name,#labels.all .name{display:inline}
.tag b{font-variant-numeric:tabular-nums}
.tag.chg{border-color:#c9352f;color:#a3221c;border-width:2px}.tag.chg-rel{border-color:#d9822b;border-width:2px}
#info .chg{color:#a3221c;font-weight:700}#info .chg-rel{color:#a35a12;font-weight:700}
.flow{background:var(--accent);color:#fff;border-radius:4px;padding:4px 10px;font-size:15px;font-weight:600;line-height:1.35;text-align:center;white-space:nowrap}
aside{background:var(--panel);border-left:1px solid var(--line);min-height:0;overflow-y:auto;overscroll-behavior:contain}
body.collapsed{grid-template-columns:minmax(0,1fr) 0}body.collapsed aside{display:none}
#toggle{position:absolute;top:12px;right:12px;z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#info{position:absolute;top:12px;left:12px;z-index:5;width:min(560px,calc(100% - 140px));max-height:calc(100% - 24px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.14);padding:14px 18px;font-size:15px;line-height:1.6}
#info[hidden]{display:none}#info h3{margin:0 40px 8px 0;font-size:18px;line-height:1.4}#info .row{margin:6px 0 0;color:var(--muted)}#info .row b{color:var(--text)}#info ul{margin:4px 0 0;padding-left:18px}
#info .x{position:absolute;top:6px;right:6px;min-height:28px;padding:0 9px}
header{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
h1{font-size:16px;line-height:1.4;margin:0 0 4px}
header p{margin:0;color:var(--muted);font-size:12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
button{font:inherit;font-size:13px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,.step:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
#steps{padding:0 0 8px}
#brief{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55}
#brief h2{margin:10px 0 4px;font-size:14px}#brief h2:first-child{margin-top:0}#brief ul{margin:0;padding-left:18px}#brief li{margin:3px 0}#brief .src{color:var(--muted);font-size:12px;margin-top:4px}
#now{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--accent-soft)}
#now .k{font-size:12px;color:var(--muted)}#now .t{font-size:16px;font-weight:700;line-height:1.4;margin:2px 0}#now .ft{font-size:13px}#now .src{font-size:12px;color:var(--muted);margin-top:6px}
.scene{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 16px;background:none;font-weight:700;font-size:14px;height:auto;min-height:44px}
.scene.on{color:var(--accent)}.scene small{color:var(--muted);font-weight:400;white-space:nowrap}
#legend{padding:10px 16px;font-size:12px;color:var(--muted);line-height:1.8}#legend i{display:inline-block;width:22px;vertical-align:middle;margin-right:6px}
.step{display:block;width:100%;text-align:left;border:0;border-left:3px solid transparent;border-radius:0;min-height:0;padding:6px 16px 6px 29px;background:none;height:auto;font-size:13px}
.step.on{border-left-color:var(--accent);background:var(--accent-soft)}

.unconfirmed{color:var(--warn)}
#nogl{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:760px){body{grid-template-columns:minmax(0,1fr);grid-template-rows:52dvh minmax(0,1fr)}body.collapsed{grid-template-rows:100dvh 0}#info{width:calc(100% - 24px);top:56px}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
<script type="importmap">__IMPORTMAP__</script>
</head>
<body>
<main id="stage"><div id="labels"></div><div id="nogl"></div><button id="toggle" type="button"></button><div id="info" hidden role="dialog" aria-live="polite"><button class="x" type="button" id="infoClose"></button><div id="infoBody"></div></div></main>
<aside>
  <header><h1 id="title"></h1><p id="reader"></p></header>
  <section id="brief" hidden></section>
  <div class="bar">
    <button id="prev" type="button"></button><button id="play" type="button"></button><button id="next" type="button"></button>
    <button id="follow" type="button" aria-pressed="true"></button><button id="overview" type="button"></button><button id="top" type="button" hidden></button><button id="names" type="button" aria-pressed="false"></button>
  </div>
  <div id="now" aria-live="polite"></div>
  <div id="steps"></div>
  <div id="legend"></div>
</aside>
<script type="application/json" id="data">__DATA__</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/OrbitControls';
import {CSS2DRenderer, CSS2DObject} from 'three/CSS2DRenderer';

const DATA = JSON.parse(document.getElementById('data').textContent);
const UI = {
  ja:{step:'手順',stepsWord:'手順',legend:'<div><i style="border-top:5px solid #9aa8b8"></i>床の太線：荷物の流れ</div><div><i style="border-top:2px solid #9aa8b8"></i>弧：データ</div><div><i style="border-top:4px solid #c9352f"></i>赤：改修箇所</div><div><i style="border-top:4px solid #d9822b"></i>橙：関連する別改修の対象</div>',prev:'前へ',play:'再生',pause:'停止',next:'次へ',follow:'カメラ追従',overview:'全体',top:'真上',names:'名称',source:'出典',place:'配置',hide:'一覧を隠す',chg:'改修箇所',chgRel:'関連する別改修の対象',show:'一覧を表示',close:'閉じる',links:'つながり',original:'原文',unconfirmed:'要確認（資料に記載なし）',hint:'ドラッグで回転・ホイールで拡大縮小・右ドラッグで移動',nogl:'この環境では3D表示が使えません。右の一覧で流れを確認できます。'},
  vi:{step:'Bước',stepsWord:'bước',legend:'<div><i style="border-top:5px solid #9aa8b8"></i>Đường dày sát sàn: thùng hàng đi</div><div><i style="border-top:2px solid #9aa8b8"></i>Vòng cung mảnh: dữ liệu</div><div><i style="border-top:4px solid #c9352f"></i>Viền đỏ: chỗ khách yêu cầu sửa</div><div><i style="border-top:4px solid #d9822b"></i>Viền cam: thuộc một đợt sửa liên quan</div>',prev:'Trước',play:'Chạy',pause:'Dừng',next:'Sau',follow:'Camera bám theo',overview:'Toàn cảnh',top:'Từ trên',names:'Tên',source:'Nguồn',place:'Vị trí',hide:'Ẩn bảng',chg:'Chỗ khách yêu cầu sửa',chgRel:'Thuộc một đợt sửa liên quan',show:'Hiện bảng',close:'Đóng',links:'Nối với',original:'Tên gốc',unconfirmed:'Chưa xác nhận (tài liệu không ghi)',hint:'Kéo để xoay · cuộn để phóng to · kéo chuột phải để di chuyển',nogl:'Máy này không hiển thị được 3D. Xem luồng ở danh sách bên cạnh.'},
  en:{step:'Step',stepsWord:'steps',legend:'<div><i style="border-top:5px solid #9aa8b8"></i>Thick line on the floor: goods</div><div><i style="border-top:2px solid #9aa8b8"></i>Thin arc: data</div><div><i style="border-top:4px solid #c9352f"></i>Red: requested change</div><div><i style="border-top:4px solid #d9822b"></i>Orange: a related change</div>',prev:'Back',play:'Play',pause:'Pause',next:'Next',follow:'Follow',overview:'Overview',top:'Top',names:'Names',source:'Source',place:'Placed',hide:'Hide panel',chg:'Requested change',chgRel:'In a related change',show:'Show panel',close:'Close',links:'Links',original:'Original',unconfirmed:'Unconfirmed (not in the documents)',hint:'Drag to orbit · scroll to zoom · right-drag to pan',nogl:'3D is not available here. The flow is listed alongside.'},
}[DATA.lang] ;
const $ = (id) => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
$('title').textContent = DATA.title;
$('reader').textContent = UI.hint;
for (const k of ['prev','next','follow','overview','top','names']) $(k).textContent = UI[k];
const setPanel = (open) => { document.body.classList.toggle('collapsed', !open); $('toggle').textContent = open ? UI.hide : UI.show; $('toggle').setAttribute('aria-expanded', open); };
$('toggle').onclick = () => setPanel(document.body.classList.contains('collapsed')); setPanel(true);
$('infoClose').textContent = UI.close; $('infoClose').setAttribute('aria-label', UI.close); $('infoClose').onclick = () => { $('info').hidden = true; };
$('names').onclick = () => { const on = $('labels').classList.toggle('all'); $('names').setAttribute('aria-pressed', on); };

// ---- flat list of steps, scene by scene
const edgeById = Object.fromEntries(DATA.edges.map((e) => [e.id, e]));
const nodeById = Object.fromEntries(DATA.nodes.map((n) => [n.id, n]));
const steps = DATA.scenes.flatMap((s, si) => s.edges.map((id) => ({scene: si, edge: edgeById[id]})));
const plain = (s) => (s || '').replace(/<br\s*\/?>/g, ' ');
const sourceText = (ref) => ref && ref.quote
  ? `<b>${UI.source}:</b> <span title="${esc(ref.file)}">${esc(ref.file.split('/').pop())}</span>${ref.part ? ' · ' + esc(ref.part) : ''}<br>「${esc(ref.quote)}」`
  : `<span class="unconfirmed">${UI.unconfirmed}</span>`;
function esc(s){return String(s).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

if (DATA.brief && DATA.brief.length) {   // what the client asks, in a few lines, with where it is written
  $('brief').hidden = false;
  $('brief').innerHTML = DATA.brief.map((b) => `<h2>${esc(b.title)}</h2><ul>${b.items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>`
    + (b.source ? `<div class="src">${UI.source}: ${esc(b.source)}</div>` : '')).join('');
}
const firstOf = DATA.scenes.map((s, si) => steps.findIndex((st) => st.scene === si));
DATA.scenes.forEach((sc, si) => {   // one row per scene; only the scene being watched shows its steps
  const head = document.createElement('button'); head.type = 'button'; head.className = 'scene'; head.dataset.s = si;
  head.innerHTML = `<span>${esc(sc.title)}</span><small>${sc.edges.length} ${UI.stepsWord}</small>`;
  head.onclick = () => { go(firstOf[si]); };
  const box = document.createElement('div'); box.className = 'scene-steps'; box.dataset.s = si; box.hidden = true;
  steps.forEach((st, i) => { if (st.scene !== si) return;
    const b = document.createElement('button'); b.type = 'button'; b.className = 'step'; b.dataset.i = i;
    b.textContent = `${i - firstOf[si] + 1}. ${plain(st.edge.label)}`; b.onclick = () => { setPlaying(false); go(i); }; box.append(b); });
  $('steps').append(head, box);
});
$('legend').innerHTML = UI.legend + (DATA.note ? `<div>${esc(DATA.note)}</div>` : '');

function webgl(){ try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch { return false; } }
let three = null;
if (webgl()) three = init(); else { $('nogl').style.display = 'flex'; $('nogl').textContent = UI.nogl; }

// ---- playback
let current = -1, playing = false, phase = 0, started = false;
const DURATION = 2.4;
function go(i){
  current = (i + steps.length) % steps.length; phase = 0;
  document.querySelectorAll('.step').forEach((el) => {
    const on = +el.dataset.i === current; el.classList.toggle('on', on);
    if (on && started && !playing) el.scrollIntoView({block:'nearest'});   // not on opening: the request summary stays in view
  });
  const e = steps[current].edge, si = steps[current].scene;
  document.querySelectorAll('.scene').forEach((el) => el.classList.toggle('on', +el.dataset.s === si));
  document.querySelectorAll('.scene-steps').forEach((el) => { el.hidden = +el.dataset.s !== si; });
  $('now').innerHTML = `<div class="k">${esc(DATA.scenes[si].title)} · ${UI.step} ${current - firstOf[si] + 1}/${DATA.scenes[si].edges.length}</div>`
    + `<div class="t">${esc(plain(e.label))}</div><div class="ft">${esc(plain(nodeById[e.source].label))} → ${esc(plain(nodeById[e.target].label))}</div>`
    + `<div class="src">${sourceText(e.ref)}</div>`;
  if (three) three.show(e);
}
function setPlaying(p){ playing = p; $('play').textContent = p ? UI.pause : UI.play; }
$('prev').onclick = () => { setPlaying(false); go(current - 1); };
$('next').onclick = () => { setPlaying(false); go(current + 1); };
$('play').onclick = () => setPlaying(!playing);
addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowRight') $('next').click();
  else if (ev.key === 'ArrowLeft') $('prev').click();
  else if (ev.key === ' ' && ev.target.tagName !== 'BUTTON') { ev.preventDefault(); $('play').click(); }
});
setPlaying(!reduced);
go(firstOf[DATA.start || 0] || 0); started = true; document.querySelector('aside').scrollTop = 0;

function init(){
  const stage = $('stage');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeef2f7);
  const camera = new THREE.PerspectiveCamera(38, 1, 1, 20000);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);
  const labels = new CSS2DRenderer({element: $('labels')});
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = .08; controls.maxPolarAngle = Math.PI / 2.05;

  scene.add(new THREE.HemisphereLight(0xffffff, 0xb8c4d2, 1.5));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  scene.add(sun);

  const mat = (color, o = {}) => new THREE.MeshStandardMaterial({color, roughness:.55, metalness:.12, ...o});
  const mesh = (geo, m, x = 0, y = 0, z = 0) => { const k = new THREE.Mesh(geo, m); k.position.set(x, y, z); k.castShadow = k.receiveShadow = true; return k; };
  const box = (w, h, d, m, x = 0, y = 0, z = 0) => mesh(new THREE.BoxGeometry(w, h, d), m, x, y + h / 2, z);
  const cyl = (r, h, m, x = 0, y = 0, z = 0) => mesh(new THREE.CylinderGeometry(r, r, h, 40), m, x, y + h / 2, z);
  const blink = [];

  function induct(g, side){
    const frame = mat(0xb9c3cf), screen = mat(0x5fb0ff, {emissive:0x5fb0ff, emissiveIntensity:.5});
    for (let i = -2; i <= 2; i++) { const z = i * 46;
      g.add(box(30, 4, 38, frame, 0, 48, z)); g.add(box(3, 48, 3, frame, -13, 0, z - 16)); g.add(box(3, 48, 3, frame, 13, 0, z + 16));
      g.add(box(3, 22, 26, mat(0x2a3440), -side * 10, 56, z)); g.add(box(1, 18, 22, screen, -side * 8.2, 58, z));
      const op = new THREE.Group(); worker(op); op.position.set(side * 30, 0, z); op.scale.setScalar(.8); g.add(op); }
    return 80; }
  function worker(g){ g.add(cyl(9, 30, mat(0x2f6fb5), 0, 0, 0)); g.add(cyl(11, 16, mat(0xf2c230), 0, 26, 0)); g.add(mesh(new THREE.SphereGeometry(9, 20, 16), mat(0xe9c4a0), 0, 52, 0)); g.add(mesh(new THREE.SphereGeometry(9.6, 20, 10, 0, Math.PI * 2, 0, Math.PI / 2), mat(0xffffff), 0, 54, 0)); }
  function tower(g, color = 0x2f6fb5, x = 0, z = 0, h = 66){
    g.add(box(40, h, 40, mat(color), x, 0, z));
    for (let y = 10; y < h - 6; y += 12) {
      g.add(box(30, 6, 1.5, mat(0x123a63), x, y, z + 20.5));
      const led = mesh(new THREE.SphereGeometry(1.5, 12, 12), new THREE.MeshStandardMaterial({color:0x35d07f, emissive:0x35d07f, emissiveIntensity:1}), x + 11, y + 3, z + 21.6);
      g.add(led); blink.push(led);
    }
  }
  const SHAPES = {
    server(g){ tower(g); return 66; },
    web(g){ tower(g); const globe = mesh(new THREE.SphereGeometry(15, 24, 18), mat(0xf0a23a), 0, 84, 0); g.add(globe);
      g.add(new THREE.LineSegments(new THREE.WireframeGeometry(new THREE.SphereGeometry(15.4, 12, 8)), new THREE.LineBasicMaterial({color:0x8a5a14})).translateY(84)); return 100; },
    mail(g){ tower(g); g.add(box(38, 22, 3, mat(0xf4f6f8), 0, 70, 0));
      const flap = mesh(new THREE.ConeGeometry(21, 12, 4), mat(0xd9e0e8), 0, 86, 0); flap.rotation.y = Math.PI / 4; flap.scale.z = .08; g.add(flap); return 94; },
    database(g){ for (let i = 0; i < 3; i++) { g.add(cyl(26, 17, mat(i % 2 ? 0x3f83c8 : 0x2f6fb5), 0, i * 20, 0)); g.add(cyl(26.6, 2, mat(0xd6e4f3), 0, i * 20 + 17, 0)); } return 62; },
    person(g){ worker(g); return 66; },
    handy(g){ worker(g); g.add(box(7, 12, 3, mat(0x1d2733), 9, 40, 12)); g.add(box(5, 4, 1, mat(0x5fb0ff, {emissive:0x5fb0ff, emissiveIntensity:.6}), 9, 47, 13.6)); return 66; },
    station(g){ const frame = mat(0xb9c3cf); g.add(box(56, 4, 40, frame, 0, 52, 0)); for (const x of [-25, 25]) for (const z of [-17, 17]) g.add(box(3, 52, 3, frame, x, 0, z));
      g.add(box(40, 28, 3, mat(0x2a3440), 0, 64, -12)); g.add(box(36, 24, 1, mat(0x5fb0ff, {emissive:0x5fb0ff, emissiveIntensity:.5}), 0, 66, -10.2)); g.add(box(12, 16, 12, mat(0x39424f), 18, 4, 0));
      const op = new THREE.Group(); worker(op); op.position.set(0, 0, 40); op.rotation.y = Math.PI; g.add(op); return 96; },
    induct5(g){ return induct(g, -1); },   // a row of 5 induction terminals, operators on the left
    induct5r(g){ return induct(g, 1); },   // the same with operators on the right
    office(g){ g.add(box(150, 3, 100, mat(0xdfe5ec))); for (const [w, d, x, z] of [[150, 4, 0, -50], [4, 100, -75, 0], [4, 100, 75, 0]]) g.add(box(w, 46, d, mat(0xc3ccd7, {transparent:true, opacity:.55}), x, 0, z));
      tower(g, 0x2f6fb5, -40, -25, 70); g.add(box(70, 30, 28, mat(0xb9c3cf), 25, 0, -20)); g.add(box(26, 18, 2, mat(0x5fb0ff, {emissive:0x5fb0ff, emissiveIntensity:.5}), 15, 34, -28)); g.add(box(26, 18, 2, mat(0x5fb0ff, {emissive:0x5fb0ff, emissiveIntensity:.5}), 45, 34, -28));
      const op = new THREE.Group(); worker(op); op.position.set(30, 0, 10); g.add(op); return 80; },
    job(g){ g.add(box(44, 20, 44, mat(0x5a6878))); const face = cyl(24, 6, mat(0xffffff), 0, 20, 0); g.add(face);
      const hand = box(3, 2, 20, mat(0xc0392b), 0, 27, -9); const pivot = new THREE.Group(); pivot.add(hand); g.add(pivot); g.userData.spin = pivot; return 30; },
    // ---- site equipment, drawn after the real machines: frames, rollers, belts, racks
    scale(g){ const steel = mat(0x8b97a6); g.add(box(110, 6, 50, steel, 0, 34, 0)); for (const x of [-50, 50]) for (const z of [-22, 22]) g.add(box(4, 34, 4, steel, x, 0, z));
      g.add(box(60, 4, 46, mat(0x35a06a), 0, 40, 0)); g.add(box(4, 70, 4, mat(0x5a6878), 0, 0, -32)); g.add(box(30, 20, 6, mat(0x1d2733), 0, 70, -32)); g.add(box(24, 10, 1, mat(0x35d07f, {emissive:0x35d07f, emissiveIntensity:.8}), 0, 75, -28.6));
      const c = box(32, 20, 24, mat(0x2d7fd0), 0, 44, 0); g.add(c); g.userData.tick = (t) => { c.position.x = ((t * 30) % 120) - 60; }; return 96; },
    reject(g){ const red = mat(0xc9352f), steel = mat(0x8b97a6); g.add(box(130, 6, 44, red, 0, 30, 0)); for (const x of [-60, 60]) for (const z of [-19, 19]) g.add(box(4, 30, 4, steel, x, 0, z));
      g.add(box(4, 14, 44, mat(0xf2c230), 63, 36, 0)); g.add(box(32, 20, 24, mat(0x2d7fd0), 20, 36, 0)); g.add(box(32, 20, 24, mat(0x2d7fd0), -24, 36, 0)); return 70; },
    conveyor(g){ const L = 170, steel = mat(0x8b97a6), blue = mat(0x2f6fb5);
      for (const x of [-L/2 + 8, L/2 - 8]) for (const z of [-22, 22]) g.add(box(5, 26, 5, steel, x, 0, z));
      for (const z of [-24, 24]) g.add(box(L, 8, 4, blue, 0, 26, z));

  }
  new ResizeObserver(resize).observe(stage); resize(); startCamera();

  const clock = new THREE.Clock(); let time = 0;
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), .1); time += dt;
    if (playing) { phase += dt / DURATION; if (phase >= 1) go(current + 1); }
    if (active && !reduced) packet.position.copy(links[active.id].curve.getPoint(playing ? Math.min(phase, 1) : (phase || 1)));
    if (!reduced) { blink.forEach((l, i) => { l.material.emissiveIntensity = (Math.sin(time * 3 + i) > 0) ? 1.2 : .15; });
      pulse.forEach((r, i) => r.scale.setScalar(1 + .12 * Math.sin(time * 3 + i)));
      Object.values(objects).forEach((o) => { if (o.userData.spin) o.userData.spin.rotation.y = -time * .8; if (o.userData.tick) o.userData.tick(time); }); }
    if (fly) { const k = 1 - Math.exp(-dt * 4); camera.position.lerp(fly.pos, k); controls.target.lerp(fly.target, k); if (camera.position.distanceTo(fly.pos) < 2) fly = null; }
    controls.update(); renderer.render(scene, camera); labels.render(scene, camera);
  });
  window.__scene = {camera, controls, objects, links, renderer};
  return {show};
}
</script>
